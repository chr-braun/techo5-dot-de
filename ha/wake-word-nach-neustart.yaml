# Workaround für:
#   https://github.com/HuskerMinion/techo5-dot/issues/51  (Wake Word nach HA-Neustart zurückgesetzt)
#   https://github.com/HuskerMinion/techo5/issues/657      (Wake Word nach Firmware-Update zurückgesetzt)
#
# Nach einem Home-Assistant-Neustart ODER einem TECHO5-Firmware-Update stehen die
# Aktivierungswort-Selects mancher Dots auf "No wake word" / "unavailable".
# Diese Automation wartet vier Minuten nach dem HA-Start und setzt sie zurück, wenn sie abweichen.
#
# ANPASSEN:
#   - "sel": Entity-ID des Aktivierungswort-Selects deines Dots.
#     Bei deutschsprachiger HA-Oberfläche heißt es "select.<name>_aktivierungswort"
#     (Wort 1) bzw. "select.<name>_aktivierungswort_2" (Wort 2).
#     Bei englischer Oberfläche evtl. "select.<name>_wake_word" / "select.<name>_wake_word_2".
#   - "wort": Das gewünschte Aktivierungswort, exakt wie es im Select steht,
#     z. B. "Okay Nabu", "Hey Jarvis", "Hey Mycroft", "Alexa".
#
# Pausen zwischen den Schritten sind Absicht: gleichzeitige Schreibzugriffe auf
# dasselbe Gerät können sich gegenseitig überschreiben.

alias: "Dots: Aktivierungswörter nach HA-Neustart wiederherstellen"
mode: single
triggers:
  - trigger: homeassistant
    event: start
actions:
  - delay: "00:04:00"
  - repeat:
      for_each:
        - { sel: select.wohnzimmer_aktivierungswort,   wort: "Okay Nabu" }
        - { sel: select.wohnzimmer_aktivierungswort_2, wort: "Hey Jarvis" }
        - { sel: select.matilda_dot_aktivierungswort,  wort: "Hey Jarvis" }
        - { sel: select.finiandot_aktivierungswort,    wort: "Hey Jarvis" }
        - { sel: select.finiandot_aktivierungswort_2,  wort: "Okay Nabu" }
      sequence:
        - if: "{{ states(repeat.item.sel) not in [repeat.item.wort] }}"
          then:
            - action: select.select_option
              target:
                entity_id: "{{ repeat.item.sel }}"
              data:
                option: "{{ repeat.item.wort }}"
            - delay: "00:00:15"
